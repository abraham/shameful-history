<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Shameful History of the USA" />
    <meta
      property="og:description"
      content="A timeline of events where the US government did something shameful or, through inaction, allowed something shameful to happen."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/img/og-image.jpg" />
    <title>Shameful History of the USA</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="bundle.css" />
  </head>

  <body class="antialiased">
    {% include "nav.njk" %}

    <div class="container">
      {% include "header.njk" %}

      <div class="timeline">
        {% for post in collections.event reversed %} {% include
        "timeline-item.njk" %} {% endfor %}
      </div>
    </div>
    {% include "footer.njk" %}
  </body>
</html>
